:root{
  --bg:#f7f3ec; --surface:#fffdf8; --surface2:#efe7d8; --ink:#2b2118; --muted:#6f6152;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Iowan Old Style','Times New Roman',serif;line-height:1.55}
a{color:var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 48px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 6px}
.home-btn{display:inline-block;font-family:system-ui,-apple-system,sans-serif;font-size:15px;font-weight:600;text-decoration:none;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:8px;box-shadow:var(--shadow)}
.crumb{font-family:system-ui,sans-serif;font-size:13px;color:var(--muted)}
h1.site{font-size:40px;line-height:1.1;margin:18px 0 6px;font-weight:700;letter-spacing:-.01em}
.tagline{font-size:18px;color:var(--muted);margin:0 0 22px;font-style:italic}
h2.shelf{font-family:system-ui,sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:34px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.searchbox{width:100%;font-size:17px;font-family:system-ui,sans-serif;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.searchbox:focus{outline:2px solid var(--accent);outline-offset:1px}
.book{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 12px;box-shadow:var(--shadow)}
.book:hover{border-color:var(--accent)}
.book h3{margin:0 0 4px;font-size:22px}
.book .by{color:var(--muted);font-size:15px;margin:0 0 6px}
.book .desc{margin:0;font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-family:system-ui,sans-serif;font-size:12.5px;background:var(--chip);border-radius:20px;padding:3px 10px;color:var(--ink)}
.prep{background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:16px 20px}
.prep p{margin:0 0 8px;font-size:16px}
.prep p:last-child{margin-bottom:0}
.prep .note{font-family:system-ui,sans-serif;font-size:13px;color:var(--muted)}
.about{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:34px}
.about h2{margin:0 0 8px;font-size:20px}
.about p{margin:0;font-size:16px}
footer{border-top:1px solid var(--line);margin-top:44px;padding-top:16px;font-family:system-ui,sans-serif;font-size:14px;color:var(--muted);text-align:center}
.noresults{font-family:system-ui,sans-serif;color:var(--muted);padding:14px 0;display:none}
/* doorway */
.door h1{font-size:34px;line-height:1.15;margin:14px 0 4px}
.door .trad{color:var(--muted);font-size:17px;margin:0 0 18px}
.facts{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 20px;margin:0 0 22px}
.facts div{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.facts div:last-child{border-bottom:none}
.facts dt{font-family:system-ui,sans-serif;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);flex:0 0 118px;padding-top:3px}
.facts dd{margin:0;font-size:16px}
.toc{list-style:none;margin:0;padding:0}
.toc li{margin:0 0 8px}
.toc a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 16px;text-decoration:none;color:var(--ink);font-size:17px;box-shadow:var(--shadow)}
.toc a:hover{border-color:var(--accent)}
.toc .n{font-family:system-ui,sans-serif;font-size:13px;color:var(--muted);display:block}
/* reader */
.reader{max-width:680px;margin:0 auto}
.reader h1{font-size:30px;line-height:1.2;margin:16px 0 4px}
.reader .chlabel{font-family:system-ui,sans-serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
.reader .body p{font-size:19.5px;line-height:1.75;margin:0 0 1.1em}
.reader .body p.verse{margin:0 0 .65em;padding-left:1.2em;text-indent:-1.2em}
.reader .body p.verse .vn{font-family:system-ui,sans-serif;font-size:13px;color:var(--gold);font-weight:700;margin-right:6px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin:26px 0 6px;flex-wrap:wrap}
.navbtn{font-family:system-ui,sans-serif;font-size:15px;font-weight:600;text-decoration:none;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:9px;box-shadow:var(--shadow)}
.navbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.navbtn.disabled{opacity:.38;pointer-events:none}
.backlink{font-family:system-ui,sans-serif;font-size:15px}
.hidden{display:none!important}
@media (max-width:520px){ h1.site{font-size:33px} .facts div{flex-direction:column;gap:2px} .reader .body p{font-size:18.5px} }

.sharebtn{font-family:system-ui,-apple-system,sans-serif;font-size:15px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:8px;box-shadow:var(--shadow);cursor:pointer}.sharebtn:disabled{opacity:.6;cursor:default}button.navbtn{font-family:inherit;font-size:inherit;background:var(--surface);cursor:pointer}.homerow{margin:0 0 18px}.updrow{margin:16px 0 0}.updmsg{font-family:system-ui,sans-serif;font-size:14px;color:var(--muted);margin-left:8px}.buildstamp{display:block;margin-top:4px;font-size:12px;color:var(--muted);opacity:.8}

html[data-theme="light"]{--bg:#f7f3ec;--surface:#fffdf8;--surface2:#efe7d8;--ink:#2b2118;--muted:#6f6152;--line:#ddd0bc;--accent:#7a2e1d;--accent-ink:#fff8f0;--gold:#9a7418;--chip:#f0e6d2;--shadow:0 1px 3px rgba(60,40,10,.12)}

.reader .body p{font-size:var(--rfs,19.5px)}
.facts dd{font-size:var(--afs,16px)}
.book .desc{font-size:var(--afs,16px)}
html[data-dys="1"] body{font-family:'Atkinson Hyperlegible',Verdana,Tahoma,'Segoe UI',sans-serif;letter-spacing:.015em}
html[data-dys="1"] .reader .body p{line-height:1.9;letter-spacing:.02em;word-spacing:.05em}
.setbtn{font-family:system-ui,-apple-system,sans-serif;font-size:15px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:8px;box-shadow:var(--shadow);cursor:pointer}
#setwrap{position:fixed;inset:0;z-index:60}
#setbackdrop{position:absolute;inset:0;background:rgba(20,12,4,.45)}
#setpanel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-bottom:none;border-radius:16px 16px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.25);padding:18px 20px 26px;font-family:system-ui,-apple-system,sans-serif}
@media (min-width:600px){ #setpanel{border-bottom:1px solid var(--line);border-radius:16px;bottom:24px} }
#setpanel h2{margin:0;font-size:20px;font-family:Georgia,serif}
#setpanel h3{margin:18px 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.sethead{display:flex;align-items:center;justify-content:space-between}
.setx{font-size:17px;line-height:1;background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.setrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.setbtn2{font-family:system-ui,sans-serif;font-size:15px;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--ink);padding:9px 15px;border-radius:9px;cursor:pointer}
.setbtn2:disabled{opacity:.45;cursor:default}
.setbtn2.on,.spd.on,.thm.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.setlab{font-size:15px;color:var(--muted);min-width:44px}
.setnote{font-size:13.5px;color:var(--muted);margin:6px 0}
.spd,.thm{font-family:system-ui,sans-serif;font-size:14.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--ink);padding:8px 13px;border-radius:9px;cursor:pointer}
.setswitch{display:flex;align-items:center;gap:10px;font-size:15.5px;padding:6px 0;cursor:pointer}
.setswitch input{width:22px;height:22px;accent-color:var(--accent)}

<script>
var BOOKS = [];
["CORE_A","CORE_B","CORE_C"].forEach(function(k){if(window[k])for(var i=0;i<window[k].length;i++)BOOKS.push(window[k][i]);});
["BATCH4_A","BATCH4_B","BATCH4_C"].forEach(function(k){if(window[k])for(var i=0;i<window[k].length;i++)BOOKS.push(window[k][i]);});
["BATCH5_A","BATCH5_B","BATCH5_C","BATCH5_D"].forEach(function(k){if(window[k])for(var i=0;i<window[k].length;i++)BOOKS.push(window[k][i]);});
["BATCH6_A","BATCH6_B","BATCH6_C","BATCH6_D","BATCH6_E"].forEach(function(k){if(window[k])for(var i=0;i<window[k].length;i++)BOOKS.push(window[k][i]);});
if(window.SUMMA_CH_1){BOOKS.push({id:"summa-theologiae",shelf:"Catholic",title:"Summa Theologiae",author:"St. Thomas Aquinas (1225 – 1274)",tradition:"Catholic",unit:"Question",dates:"Written 1265 – 1274; English Dominican Province translation, 1920",why:"The Summa Theologiae of St. Thomas Aquinas (1225–1274) — the most famous work of theology in the Western church, left unfinished at his death in 1274. Question by question it treats of God, creation, angels, man, the moral life, law and grace, the virtues and vices, Christ, and the sacraments, each Article weighing objections before resolving them: “I answer that…” It is a mountain, but it is climbed one Question at a time, and every path is marked.",start:"Begin with the Prima Pars, Question 1 — “Whether, besides philosophy, any further doctrine is required?” — Aquinas begins by justifying the whole enterprise.",len:"611 readings — one for every Question (each Part numbers its Questions from 1 again, so the last reading, 611, is the Supplement's Question 99)",topics:"aquinas summa theologiae thomas scholasticism theology doctrine philosophy god sacraments virtues",source:"The Fathers of the English Dominican Province translation (Benziger Bros., 1920), via New Advent's public-domain transcription. This is the complete Summa: all 611 Questions, each as one reading with its Articles in full. The four Parts Aquinas wrote hold 512 Questions; the Supplement (99 Questions) was compiled after his death from his commentary on the Sentences of Peter Lombard.",chapters:[].concat(window.SUMMA_CH_1||[],window.SUMMA_CH_2||[],window.SUMMA_CH_3||[],window.SUMMA_CH_4||[],window.SUMMA_CH_5||[])});}

var PREP = [];

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function byId(id){for(var i=0;i<BOOKS.length;i++)if(BOOKS[i].id===id)return BOOKS[i];return null;}
var SITE_URL = "https://jesuslovestyler.github.io/Library-of-Faith/";
var BUILD_STAMP = "2026-10-26.4";
function flashBtn(btn,msg){ if(!btn) return; var old=btn.textContent; btn.textContent=msg; btn.disabled=true; setTimeout(function(){ btn.textContent=old; btn.disabled=false; },2400); }
function copyLink(url,btn){
  function done(){ flashBtn(btn,"Link copied \u2713"); }
  function legacy(){ var ta=document.createElement("textarea"); ta.value=url; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){ flashBtn(btn,"Could not copy the link"); } document.body.removeChild(ta); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done,legacy); } else { legacy(); }
}
function doShare(title,text,url,btn){
  if(navigator.share){ navigator.share({title:title,text:text,url:url}).then(function(){},function(err){ if(!err || err.name!=="AbortError"){ copyLink(url,btn); } }); }
  else { copyLink(url,btn); }
}
function shareLibrary(btn){ doShare("Library of Faith","Classic books and documents of the Christian faith, public domain, made easy to read.",SITE_URL,btn); }
function shareBook(id,btn){ var b=byId(id); if(!b) return; doShare(b.title+" \u00b7 Library of Faith", b.title+" by "+b.author+" \u2014 read it free in the Library of Faith.", SITE_URL+"#/book/"+b.id, btn); }
function checkUpdates(){
  var msg=document.getElementById("updmsg"); var btn=document.getElementById("updbtn");
  if(msg) msg.textContent="Checking\u2026"; if(btn) btn.disabled=true;
  function fail(){ if(msg) msg.textContent="Couldn\u2019t check for updates just now \u2014 please try again when you\u2019re connected."; if(btn) btn.disabled=false; }
  fetch(SITE_URL+"?lofv="+Date.now(),{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("bad response"); return r.text(); }).then(function(t){
    var m=t.match(/name="library-build" content="([^"]+)"/);
    if(!m){ fail(); return; }
    if(m[1]===BUILD_STAMP){ if(msg) msg.textContent="This library is up to date."; if(btn) btn.disabled=false; }
    else { if(msg) msg.textContent="A newer copy of the library is ready \u2014 updating\u2026"; setTimeout(function(){ location.href=SITE_URL+"?lofv="+Date.now()+(location.hash||"#/"); },1000); }
  }).catch(fail);
}

function chapLabel(b,c){ if(c.head) return c.head; if(c.label) return b.id==="summa-theologiae" ? "Reading "+c.n+" · "+c.label : c.label; if(b.chapters.length===1) return ""; return (b.unit||"Chapter")+" "+c.n; }
function countLabel(b){ var n=b.chapters.filter(function(c){return !c.head;}).length; var u=(b.unit||"Chapter").toLowerCase(); return n+" "+(n===1?"reading":u+"s"); }

function renderHome(filter){
  var q=(filter||"").toLowerCase().trim();
  var html='<h1 class="site">Library of Faith</h1><p class="tagline">Classic books and documents of the Christian faith, public domain, made easy to read.</p>';
  html+='<input class="searchbox" id="search" type="search" placeholder="Search by title, author, or topic…" value="'+esc(filter||"")+'" aria-label="Search the library">';
  html+='<div class="noresults" id="noresults">No books match that search yet.</div>';
  html+='<p class="homerow"><button type="button" class="sharebtn" onclick="shareLibrary(this)">Share this library</button></p>';
  var shelves=["Documents & Creeds","Protestant","Catholic","Eastern Orthodox"];
  shelves.forEach(function(sh){
    var books=BOOKS.filter(function(b){return b.shelf===sh;});
    var visible=books.filter(function(b){return !q || (b.title+" "+b.author+" "+b.topics+" "+b.tradition).toLowerCase().indexOf(q)>-1;});
    html+='<section data-shelf="'+sh+'"><h2 class="shelf">'+sh+'</h2>';
    visible.forEach(function(b){
      html+='<a class="book" href="#/book/'+b.id+'"><h3>'+b.title+'</h3><p class="by">'+b.author+'</p><p class="desc">'+b.why.split(".")[0]+'.</p><span class="meta"><span class="chip">'+b.tradition+'</span><span class="chip">'+b.len+'</span><span class="chip">'+countLabel(b)+'</span></span></a>';
    });
    html+='</section>';
  });
  PREP.forEach(function(p){
    html+='<section><h2 class="shelf">'+p.shelf+'</h2><div class="prep">';
    p.items.forEach(function(it){ html+='<p>'+it+'</p>'; });
    html+='<p class="note">This shelf is being prepared.</p></div></section>';
  });
  html+='<div class="about"><h2>About this library</h2><p>Every text here is public domain in both its edition and its translation, and the source is named on each book\'s page. Nothing here is locked away — everything may be copied and shared freely. This library belongs to the whole body of Christ — early church, Eastern Orthodox, Catholic, and Protestant treasures side by side, each labeled with its own tradition, in the hope that we all grow together into the unity of the faith. Our aim is to educate and unite: that Orthodox, Catholic, and Protestant Christians might learn from one another\'s treasures and be one, as Jesus prayed.</p><p class="updrow"><button type="button" class="sharebtn" id="updbtn" onclick="checkUpdates()">Check for updates</button><span class="updmsg" id="updmsg"></span></p></div>';
  document.getElementById("app").innerHTML=html;
  document.getElementById("crumb").textContent="";
  var inp=document.getElementById("search");
  inp.addEventListener("input",function(){
    var v=inp.value; var pos=inp.selectionStart;
    renderHome(v);
    var n=document.getElementById("search"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){}
    var any=document.querySelectorAll(".book").length>0;
    document.getElementById("noresults").style.display=any?"none":"block";
  });
  if(q){ var any2=document.querySelectorAll(".book").length>0; document.getElementById("noresults").style.display=any2?"none":"block"; }
}

function renderDoor(id){
  var b=byId(id); if(!b){location.hash="#/";return;}
  var html='<p><a class="backlink" href="#/">← Library home</a></p><div class="door"><h1>'+b.title+'</h1><p class="trad">'+b.author+'</p>';
  html+='<dl class="facts">';
  html+='<div><dt>Tradition</dt><dd>'+b.tradition+'</dd></div>';
  html+='<div><dt>Dates</dt><dd>'+b.dates+'</dd></div>';
  html+='<div><dt>Why read it</dt><dd>'+b.why+'</dd></div>';
  html+='<div><dt>Best place to start</dt><dd>'+b.start+'</dd></div>';
  html+='<div><dt>Length</dt><dd>'+b.len+'</dd></div>';
  html+='<div><dt>Source</dt><dd>'+b.source+'</dd></div>';
  html+='</dl><p><button type="button" class="sharebtn" onclick="shareBook(\''+b.id+'\',this)">Share this book</button></p><h2 class="shelf">Contents</h2><ol class="toc">';
  b.chapters.forEach(function(c,i){
    html+='<li><a href="#/read/'+b.id+'/'+c.n+'"><span class="n">'+(chapLabel(b,c)||"Reading")+'</span>'+c.title+'</a></li>';
  });
  html+='</ol></div>';
  document.getElementById("app").innerHTML=html;
  document.getElementById("crumb").textContent=b.title;
  window.scrollTo(0,0);
}

function renderRead(id,num){
  var b=byId(id); if(!b){location.hash="#/";return;}
  var idx=-1; for(var i=0;i<b.chapters.length;i++) if(b.chapters[i].n===num) idx=i;
  if(idx<0){location.hash="#/book/"+id;return;}
  var c=b.chapters[idx];
  CUR={id:id,n:num,label:chapLabel(b,c)};
  var prev=b.chapters[idx-1], next=b.chapters[idx+1];
  var html='<p><a class="backlink" href="#/book/'+b.id+'">← Contents — '+b.title+'</a></p><div class="reader">';
  html+='<h1>'+b.title+'</h1><p class="chlabel">'+(chapLabel(b,c)?(chapLabel(b,c)+(c.title?" · ":"")):"")+c.title+'</p><div class="body">';
  c.paras.forEach(function(p,i){
    if(b.numbered){ html+='<p class="verse"><span class="vn">'+(i+1)+'.</span>'+esc(p)+'</p>'; }
    else{ html+='<p>'+esc(p).replace(/\n/g,'<br>')+'</p>'; }
  });
  html+='</div><div class="navrow">';
  if(prev){ html+='<a class="navbtn" href="#/read/'+b.id+'/'+prev.n+'">← '+chapLabel(b,prev)+'</a>'; } else { html+='<span class="navbtn disabled">← Previous</span>'; }
  html+='<a class="navbtn" href="#/book/'+b.id+'">Contents</a>';
  html+='<button type="button" class="navbtn" onclick="shareBook(\''+b.id+'\',this)">Share</button>';
  if(next){ html+='<a class="navbtn primary" href="#/read/'+b.id+'/'+next.n+'">'+chapLabel(b,next)+' →</a>'; } else { html+='<a class="navbtn primary" href="#/book/'+b.id+'">Finish ✓</a>'; }
  html+='</div></div>';
  document.getElementById("app").innerHTML=html;
  document.getElementById("crumb").textContent=b.title;
  window.scrollTo(0,0);
}

/* ---- reading settings (size, dyslexia-friendly font, theme) — remembered on this device ---- */
var SET={ts:2,dys:false,theme:"device"};
try{ var saved=JSON.parse(localStorage.getItem("lof-reading-settings")||"null"); if(saved){ if(typeof saved.ts==="number") SET.ts=Math.max(0,Math.min(4,saved.ts)); if(typeof saved.dys==="boolean") SET.dys=saved.dys; if(["device","light","dark","sepia"].indexOf(saved.theme)>-1) SET.theme=saved.theme; } }catch(e){}
var RFS=[17,18.5,19.5,21.5,24], RFS_PHONE=[16,17,18.5,20,22.5], AFS=[14.5,15.5,16,17.5,19], TSNAMES=["Small","Comfortable","Medium","Large","Extra large"];
function saveSettings(){ try{ localStorage.setItem("lof-reading-settings",JSON.stringify(SET)); }catch(e){} }
function applySettings(){
  var root=document.documentElement;
  if(SET.theme==="device"){ root.removeAttribute("data-theme"); } else { root.setAttribute("data-theme",SET.theme); }
  if(SET.dys){ root.setAttribute("data-dys","1"); } else { root.removeAttribute("data-dys"); }
  var phone=window.matchMedia && window.matchMedia("(max-width: 520px)").matches;
  root.style.setProperty("--rfs",(phone?RFS_PHONE:RFS)[SET.ts]+"px");
  root.style.setProperty("--afs",AFS[SET.ts]+"px");
  var tn=document.getElementById("txtName"); if(tn) tn.textContent=TSNAMES[SET.ts];
  var dt=document.getElementById("dysToggle"); if(dt) dt.checked=SET.dys;
  var ths=document.querySelectorAll(".thm"); for(var i=0;i<ths.length;i++){ ths[i].classList.toggle("on",ths[i].getAttribute("data-theme-set")===SET.theme); }
  var sps=document.querySelectorAll(".spd"); for(var j=0;j<sps.length;j++){ sps[j].classList.toggle("on",parseFloat(sps[j].getAttribute("data-rate"))===SPK.rate); }
}
/* ---- listen: read the current reading aloud with the device's speech ---- */
var CUR=null;
var SPK={chunks:[],i:0,rate:1,state:"idle"};
function curParas(){
  if(!CUR) return null;
  var b=byId(CUR.id); if(!b) return null;
  for(var i=0;i<b.chapters.length;i++) if(b.chapters[i].n===CUR.n) return b.chapters[i].paras;
  return null;
}
function chunkText(paras){
  var out=[];
  paras.forEach(function(p){
    var s=p.replace(/\s+/g," ").trim();
    while(s.length>700){
      var cut=s.lastIndexOf(". ",650);
      if(cut<200) cut=s.lastIndexOf(" ",700);
      if(cut<200) cut=700;
      out.push(s.slice(0,cut+1)); s=s.slice(cut+1).trim();
    }
    if(s) out.push(s);
  });
  return out;
}
function pickVoice(){
  try{
    var vs=window.speechSynthesis.getVoices()||[];
    for(var i=0;i<vs.length;i++){ if(/^en([-_]|$)/i.test(vs[i].lang||"")) return vs[i]; }
  }catch(e){}
  return null;
}
function refreshVoiceNote(){
  var note=document.getElementById("voiceNote"); if(!note) return;
  if(window.speechSynthesis && !pickVoice()){ note.classList.remove("hidden"); } else { note.classList.add("hidden"); }
}
function setPlayLabel(){
  var btn=document.getElementById("spkPlay"); if(!btn) return;
  btn.textContent = SPK.state==="playing" ? "⏸ Pause" : (SPK.state==="paused" ? "▶ Resume" : "▶ Play");
}
function speakChunk(){
  if(SPK.i>=SPK.chunks.length){ SPK.state="idle"; SPK.i=0; setPlayLabel(); return; }
  var u=new SpeechSynthesisUtterance(SPK.chunks[SPK.i]);
  u.rate=SPK.rate;
  var v=pickVoice(); if(v) u.voice=v;
  u.onend=function(){ if(SPK.state==="playing"){ SPK.i++; speakChunk(); } };
  u.onerror=function(){ if(SPK.state==="playing"){ SPK.state="idle"; setPlayLabel(); } };
  window.speechSynthesis.speak(u);
}
function stopSpeak(){
  if(window.speechSynthesis){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  SPK.state="idle"; SPK.i=0; SPK.chunks=[];
  setPlayLabel();
}
function updateListenUI(){
  var hint=document.getElementById("listenHint"), play=document.getElementById("spkPlay"), stop=document.getElementById("spkStop");
  if(!hint) return;
  if(!window.speechSynthesis){ hint.textContent="This device does not offer read-aloud speech."; play.disabled=true; stop.disabled=true; return; }
  if(CUR){ var b=byId(CUR.id); hint.textContent="Listening to: "+(b?b.title:"")+" — "+CUR.label+"."; play.disabled=false; stop.disabled=false; }
  else { hint.textContent="Open any reading to listen to it read aloud."; play.disabled=true; stop.disabled=true; }
  refreshVoiceNote();
}
function openSettings(){ document.getElementById("setwrap").classList.remove("hidden"); updateListenUI(); }
function closeSettings(){ document.getElementById("setwrap").classList.add("hidden"); }
document.getElementById("setopen").addEventListener("click",openSettings);
document.getElementById("setclose").addEventListener("click",closeSettings);
document.getElementById("setbackdrop").addEventListener("click",closeSettings);
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeSettings(); });
document.getElementById("spkPlay").addEventListener("click",function(){
  if(!window.speechSynthesis) return;
  if(SPK.state==="playing"){ window.speechSynthesis.pause(); SPK.state="paused"; setPlayLabel(); return; }
  if(SPK.state==="paused"){ window.speechSynthesis.resume(); SPK.state="playing"; setPlayLabel(); return; }
  var paras=curParas(); if(!paras) return;
  SPK.chunks=chunkText(paras); SPK.i=0; SPK.state="playing";
  window.speechSynthesis.cancel();
  speakChunk(); setPlayLabel();
});
document.getElementById("spkStop").addEventListener("click",stopSpeak);
var spdBtns=document.querySelectorAll(".spd");
for(var si=0;si<spdBtns.length;si++){ spdBtns[si].addEventListener("click",function(){
  SPK.rate=parseFloat(this.getAttribute("data-rate"));
  applySettings();
  if(SPK.state==="playing"||SPK.state==="paused"){ var keep=SPK.i; window.speechSynthesis.cancel(); SPK.i=keep; SPK.state="playing"; speakChunk(); setPlayLabel(); }
});}
document.getElementById("txtMinus").addEventListener("click",function(){ if(SET.ts>0){ SET.ts--; saveSettings(); applySettings(); } });
document.getElementById("txtPlus").addEventListener("click",function(){ if(SET.ts<4){ SET.ts++; saveSettings(); applySettings(); } });
document.getElementById("dysToggle").addEventListener("change",function(){ SET.dys=this.checked; saveSettings(); applySettings(); });
var thmBtns=document.querySelectorAll(".thm");
for(var ti=0;ti<thmBtns.length;ti++){ thmBtns[ti].addEventListener("click",function(){ SET.theme=this.getAttribute("data-theme-set"); saveSettings(); applySettings(); }); }
if(window.speechSynthesis && window.speechSynthesis.onvoiceschanged!==undefined){ window.speechSynthesis.onvoiceschanged=refreshVoiceNote; }
applySettings();

function route(){
  stopSpeak();
  CUR=null;
  var h=location.hash||"#/";
  var m;
  if(m=h.match(/^#\/book\/([\w-]+)$/)){ renderDoor(m[1]); }
  else if(m=h.match(/^#\/read\/([\w-]+)\/(\d+)$/)){ renderRead(m[1],parseInt(m[2],10)); }
  else{ renderHome(""); }
}
window.addEventListener("hashchange",route);
route();
</script>
